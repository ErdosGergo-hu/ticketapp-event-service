server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5434/event_db
clients.ticket-backend.url=http://localhost:8081
spring.kafka.bootstrap-servers=localhost:9092

logging.level.com.erdos.ticketapp=DEBUG
logging.level.org.apache.kafka.common.config.AbstractConfig=WARN
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,conditions,loggers,liquibase,mappings
